services:
  mongo:
    image: mongo:7
    container_name: gym-mongo
    # Replica set de un solo nodo: necesario para usar transacciones multidocumento
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db   # persistencia: los datos sobreviven a docker compose down
    healthcheck:
      # Inicializa el replica set la primera vez y después solo verifica que esté vivo
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo_data:
